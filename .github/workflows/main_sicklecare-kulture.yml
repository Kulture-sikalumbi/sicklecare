# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: 'Build and deploy Node.js app to Azure Web App: sicklecare-kulture'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js version
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: npm
    
    - name: npm install, build, and test
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      run: |
        npm install --include=optional
        npm run build
        npm run test --if-present
        if ! grep -Eq '[.]flex[{][^}]*display:flex' .next/static/css/*.css; then
          echo "Production CSS is missing the expected Tailwind utility classes."
          exit 1
        fi
        npm prune --omit=dev
        mkdir deploy
        cp -a .next/standalone/. deploy/
        mkdir -p deploy/.next
        cp -a .next/static deploy/.next/
        cp -a public deploy/public
        python3 - <<'PY'
        from pathlib import Path
        from zipfile import ZIP_DEFLATED, ZipFile

        root = Path("deploy")
        with ZipFile("release.zip", "w", ZIP_DEFLATED) as archive:
            for path in root.rglob("*"):
                if path.is_file():
                    archive.write(path, path.relative_to(root).as_posix())
        PY
        unzip -Z1 release.zip | grep -Fxq 'server.js'
        unzip -Z1 release.zip | grep -Fxq 'package.json'
        unzip -Z1 release.zip | grep -Eq '^\.next/static/css/[^/]+\.css$'

    - name: Login to Azure with GitHub OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: 'Deploy to Azure Web App'
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'sicklecare-kulture'
        package: ./release.zip
        startup-command: 'PORT=${PORT:-8080} HOSTNAME=0.0.0.0 node server.js'

    - name: Configure Node runtime and restart Azure Web App
      run: |
        resource_group="$(az webapp list --query "[?name=='sicklecare-kulture'] | [0].resourceGroup" --output tsv)"
        if [ -z "$resource_group" ]; then
          echo "Could not find the Azure Web App resource group."
          exit 1
        fi
        is_linux="$(az webapp show --name sicklecare-kulture --resource-group "$resource_group" --query reserved --output tsv)"
        if [ "$is_linux" = "true" ]; then
          az webapp config set --name sicklecare-kulture --resource-group "$resource_group" --linux-fx-version 'NODE|24-lts'
          runtime="$(az webapp config show --name sicklecare-kulture --resource-group "$resource_group" --query linuxFxVersion --output tsv)"
        else
          az webapp config set --name sicklecare-kulture --resource-group "$resource_group" --use-32bit-worker-process false
          az webapp config appsettings set --name sicklecare-kulture --resource-group "$resource_group" --settings WEBSITE_NODE_DEFAULT_VERSION='~24' --output none
          runtime="Windows Node $(az webapp config appsettings list --name sicklecare-kulture --resource-group "$resource_group" --query "[?name=='WEBSITE_NODE_DEFAULT_VERSION'].value | [0]" --output tsv)"
        fi
        echo "Configured Azure runtime: ${runtime}"
        az webapp restart --name sicklecare-kulture --resource-group "$resource_group"

    - name: Capture Azure startup logs
      run: |
        resource_group="$(az webapp list --query "[?name=='sicklecare-kulture'] | [0].resourceGroup" --output tsv)"
        az webapp log config --name sicklecare-kulture --resource-group "$resource_group" --docker-container-logging filesystem --level Verbose
        timeout 20s az webapp log tail --name sicklecare-kulture --resource-group "$resource_group" || true

    - name: Verify deployed Tailwind CSS
      run: |
        for attempt in $(seq 1 12); do
          css_path="$(curl -fsSL --max-time 8 'https://sicklecare-kulture.azurewebsites.net/' | grep -oE '/_next/static/css/[^" ]+\.css' | head -n 1 || true)"
          if [ -n "$css_path" ] && curl -fsSL --max-time 8 "https://sicklecare-kulture.azurewebsites.net${css_path}?verify=${GITHUB_SHA}" | grep -Eq '[.]flex[{][^}]*display:flex'; then
            echo "Azure is serving the Tailwind CSS bundle: ${css_path}"
            exit 0
          fi
          echo "Waiting for the deployed CSS bundle (attempt ${attempt}/12)..."
          sleep 5
        done
        echo "Azure is still serving CSS without the expected Tailwind utilities."
        exit 1
