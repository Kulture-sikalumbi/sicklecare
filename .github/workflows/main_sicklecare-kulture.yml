# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: 'Build and deploy Node.js app to Azure Web App: sicklecare-kulture'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js version
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: npm
    
    - name: npm install, build, and test
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      run: |
        npm install --include=optional
        npm run build
        npm run test --if-present
        if ! grep -Eq '[.]flex[{][^}]*display:flex' .next/static/css/*.css; then
          echo "Production CSS is missing the expected Tailwind utility classes."
          exit 1
        fi
        npm prune --omit=dev
        mkdir deploy
        cp -a .next node_modules package.json next.config.ts public deploy/

    - name: Login to Azure with GitHub OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: 'Deploy to Azure Web App'
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'sicklecare-kulture'
        package: ./deploy

    - name: Restart Azure Web App
      run: |
        resource_group="$(az webapp list --query "[?name=='sicklecare-kulture'] | [0].resourceGroup" --output tsv)"
        if [ -z "$resource_group" ]; then
          echo "Could not find the Azure Web App resource group."
          exit 1
        fi
        az webapp restart --name sicklecare-kulture --resource-group "$resource_group"

    - name: Verify deployed Tailwind CSS
      run: |
        for attempt in $(seq 1 12); do
          css_path="$(curl -fsSL 'https://sicklecare-kulture.azurewebsites.net/' | grep -oE '/_next/static/css/[^" ]+\.css' | head -n 1 || true)"
          if [ -n "$css_path" ] && curl -fsSL "https://sicklecare-kulture.azurewebsites.net${css_path}?verify=${GITHUB_SHA}" | grep -Eq '[.]flex[{][^}]*display:flex'; then
            echo "Azure is serving the Tailwind CSS bundle: ${css_path}"
            exit 0
          fi
          echo "Waiting for the deployed CSS bundle (attempt ${attempt}/12)..."
          sleep 5
        done
        echo "Azure is still serving CSS without the expected Tailwind utilities."
        exit 1
